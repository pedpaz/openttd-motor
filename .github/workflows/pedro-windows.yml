name: Pedro - Windows

# Gera a versão para Windows (64 bits) do nosso motor a cada envio e publica em
# Releases como "versao-teste", já com o OpenGFX e o mod de veículos (openttd-frota).

on:
  push:
    branches: [jgrpp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pedro-windows
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build
      shell: bash
      run: |
        mkdir build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"
        cmake --build . --target openttd

    - name: Build mod de veículos
      shell: bash
      run: |
        pip install nml pillow
        git clone --depth 1 https://github.com/pedpaz/openttd-frota frota
        cd frota && ./construir.sh

    - name: Baixar cenário em alta definição (OpenGFX2 High Def, GPL v2)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p hd
        gh release list -R OpenTTD/OpenGFX2 --limit 15 || true
        for tag in $(gh release list -R OpenTTD/OpenGFX2 --limit 15 --json tagName --jq '.[].tagName'); do
          gh release view "$tag" -R OpenTTD/OpenGFX2 --json assets --jq '.assets[].name' | sed "s/^/  $tag: /"
          if gh release download "$tag" -R OpenTTD/OpenGFX2 --pattern '*HighDef*' -D hd --clobber; then
            echo "OpenGFX2 High Def: $tag"; break
          fi
        done
        cd hd
        for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" && rm "$z"; done
        ls -la
        T=$(ls *.tar | head -1)
        tar -xOf "$T" --wildcards '*.obg' | grep -E '^name' | head -1 | sed 's/^name *= *//' > nome.txt
        echo "nome do conjunto: $(cat nome.txt)"
        cp "$T" opengfx2-highdef.tar

    - name: Package
      shell: bash
      run: |
        mkdir -p pacote/OpenTTD-Pedro
        cd pacote/OpenTTD-Pedro
        cp ../../build/openttd.exe .
        for d in lang baseset ai game scripts social_integration; do
          [ -d ../../build/$d ] && cp -r ../../build/$d . || true
        done
        cp ../../COPYING.md . 2>/dev/null || true
        curl -sSL https://cdn.openttd.org/opengfx-releases/7.1/opengfx-7.1-all.zip -o ogfx.zip
        unzip -q ogfx.zip -d baseset && rm ogfx.zip
        cp ../../hd/opengfx2-highdef.tar baseset/
        mkdir -p newgrf
        cp ../../frota/build/frota.grf newgrf/
        # config portátil: o jogo usa esta pasta para tudo, já liga o mod e o cenário HD
        printf '[graphicsset]\nname = %s\n\n[newgrf]\nfrota.grf = \n' "$(cat ../../hd/nome.txt)" > openttd.cfg
        cat openttd.cfg
        cd ..
        7z a -tzip OpenTTD-Pedro-windows-x64.zip OpenTTD-Pedro > /dev/null

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: OpenTTD-Pedro-windows-x64
        path: pacote/OpenTTD-Pedro-windows-x64.zip

    - name: Publish release "versao-teste"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete versao-teste --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
        gh release create versao-teste pacote/OpenTTD-Pedro-windows-x64.zip hd/opengfx2-highdef.tar \
          -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
          --title "Versão de teste ($(git rev-parse --short HEAD))" \
          --notes "Baixe o .zip, extraia e abra openttd.exe. Já vem com o cenário OpenGFX2 High Def e o mod de veículos ativados."
